<!doctype html>
<!-- Placement study only; example values, no account access or persistence. -->
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juicebar · Soll-Markierung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#292e2d;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4286cc;outline-offset:4px}main{max-width:1130px;margin:auto;padding:32px 30px 110px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#777d76}h1{font-size:32px;letter-spacing:-1px;margin:12px 0 10px;font-weight:650}header p{margin:0;color:#72766f;line-height:1.6}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 22px}.option{border:1px solid #dbddd5;background:#eeeee7;border-radius:12px;text-align:left;padding:16px 18px;color:inherit}.option[aria-pressed=true]{border-color:#8e613b;background:#fffdf7;box-shadow:0 0 0 1px #8e613b}.option b{display:block;font-size:14px}.option small{display:block;margin-top:7px;color:#77796f}.tiny-bar{position:relative;height:26px;margin:16px 0 0}.tiny-bar:before{content:"";position:absolute;top:12px;width:100%;height:6px;border-radius:9px;background:linear-gradient(to right,#d88f68 60%,#d9d3c9 60%)}.diamond{width:10px;height:10px;display:inline-block;flex-shrink:0;background:currentColor;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.marker{position:absolute;top:var(--marker-top);left:clamp(5px,var(--pace),calc(100% - 5px));transform:translateX(-50%);z-index:1}.tiny-bar .marker{left:34%}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{--ink:#e6e6e6;--muted:#979797;--card:#202020;--track:#3c302a;--provider:#eea075;background:#303030;color:var(--ink);border:1px solid #3e3e3e;padding:20px;border-radius:18px}.panel.light{--ink:#292929;--muted:#858580;--card:#fff;--track:#f0e6dd;--provider:#c6754a;background:#eae9e3;border-color:#dfdfd7}.panel-heading{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:0 1px 14px}.panel-heading strong{color:var(--ink);font-weight:550}.card{background:var(--card);border-radius:15px;padding:21px}.account{display:flex;align-items:center;gap:11px;margin-bottom:26px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--provider) 10%,transparent);color:var(--provider);font-size:29px}.account h2{margin:0;font-size:19px;letter-spacing:-.3px}.account small{display:block;font-size:12px;margin-top:4px;color:var(--muted)}.status{margin-left:auto;color:#64b796;font-size:11px;font-weight:600}.label-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.value{font-size:30px;letter-spacing:-1px}.value small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:5px}.bar{position:relative;height:18px;margin:4px 0 14px}.track,.fill{position:absolute;top:12px;height:6px;border-radius:20px}.track{width:100%;background:var(--track)}.fill{width:var(--rest);background:var(--provider)}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;font-weight:550}.target{display:flex;align-items:center;gap:8px;color:var(--ink)}.limit+.limit{margin-top:25px}.codex{--provider:#72aafa;--track:#283448;margin-top:14px}.light .codex{--provider:#4287e2;--track:#e3edf9}.codex .account{margin-bottom:17px}.codex .logo{font:600 17px ui-monospace,monospace}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:12px;color:#62695f}.controls label{display:flex;gap:10px;align-items:center}input{accent-color:#a76c45;width:155px}.note{font-size:12px;color:#777b72;margin:17px 0 0;line-height:1.5}.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:7px;background:#282e2df2;border:1px solid #ffffff26;border-radius:14px;color:white;box-shadow:0 5px 22px #18251e26}.nav button{border:0;border-radius:9px;background:#ffffff12;color:white;padding:10px 15px}.nav span{font-size:12px;min-width:146px;text-align:center}@media(max-width:730px){main{padding:24px 16px 105px}.panels{grid-template-columns:1fr}.options{gap:7px}.option{padding:12px 10px}.option b{font-size:12px}.option small{font-size:10px}.panel{padding:15px}h1{font-size:27px}}
</style>
<main>
<header><div class="eyebrow">Juicebar · Detailstudie</div><h1>Wie nah gehört die Raute an den Balken?</h1><p>Gleiches Symbol am Sollstand und in der Legende. Drei Positionen im direkten Vergleich.</p></header>
<div class="options" aria-label="Position auswählen"></div>
<div class="panels"></div>
<div class="controls"><label>Claude übrig <input id="rest" aria-label="Claude verbleibendes Kontingent" type="range" min="0" max="100" value="60"><output id="rest-output">60 %</output></label><label>Soll <input id="pace" aria-label="Claude Sollstand" type="range" min="0" max="100" value="34"><output id="pace-output">34 %</output></label></div>
<p class="note">25 % bzw. 50 % der Rautenhöhe reichen in den Balken hinein. Balken 6 px · Raute 10 px. Beispieldaten.</p>
</main>
<nav class="nav" aria-label="Varianten"><button id="prev" aria-label="Vorherige Variante">←</button><span id="current" aria-live="polite"></span><button id="next" aria-label="Nächste Variante">→</button></nav>
<script>
const variants={A:{name:'Darüber',detail:'2 px Abstand · bisher',top:0},B:{name:'25 % im Balken',detail:'Spitze berührt die Füllung',top:4.5},C:{name:'50 % im Balken',detail:'Mitte auf der Balkenkante',top:7}};
let selected=new URLSearchParams(location.search).get('variant')||'C';if(!variants[selected])selected='B';
let rest=60,pace=34;
function limit(name,value,target,reset){return `<div class="limit"><div class="label-row"><span>${name}</span><span class="value">${value}<small>% übrig</small></span></div><div class="bar" style="--rest:${value}%;--pace:${target}%"><span class="track"></span><span class="fill"></span><span class="diamond marker" aria-hidden="true"></span></div><div class="meta"><span>↻ &nbsp;Reset in ${reset}</span><span class="target"><i class="diamond" aria-hidden="true"></i>Soll ${target} %</span></div></div>`;}
function draw(){document.documentElement.style.setProperty('--marker-top',variants[selected].top+'px');document.querySelector('.options').innerHTML=Object.entries(variants).map(([key,v])=>`<button class="option" data-variant="${key}" aria-pressed="${key===selected}"><b>${key} · ${v.name}</b><small>${v.detail}</small><div class="tiny-bar" style="--marker-top:${v.top}px"><i class="diamond marker"></i></div></button>`).join('');document.querySelector('.panels').innerHTML=['dark','light'].map(theme=>`<section class="panel ${theme}"><div class="panel-heading"><span>${theme==='dark'?'Dunkle':'Helle'} Ansicht</span><strong>${selected} · ${variants[selected].name}</strong></div><div class="card"><div class="account"><span class="logo" aria-hidden="true">✳</span><div><h2>Claude</h2><small>Max</small></div><span class="status">Aktuell</span></div>${limit('5 Stunden',rest,pace,'1 Std. 40 Min.')}${limit('Woche',42,58,'4 Tagen')}</div><div class="card codex"><div class="account"><span class="logo" aria-hidden="true">›_</span><div><h2>Codex</h2><small>Plus</small></div><span class="status">Aktuell</span></div>${limit('5 Stunden',80,65,'3 Std. 15 Min.')}</div></section>`).join('');document.querySelector('#current').textContent=selected+' · '+variants[selected].name;}
function select(key){selected=key;const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);draw();}
function step(n){const keys=Object.keys(variants);select(keys[(keys.indexOf(selected)+n+3)%3]);}
document.querySelector('.options').addEventListener('click',event=>{const b=event.target.closest('[data-variant]');if(b)select(b.dataset.variant);});document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
document.addEventListener('keydown',event=>{if(event.target.closest('input'))return;if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();step(event.key==='ArrowRight'?1:-1);}});
for(const id of ['rest','pace'])document.querySelector('#'+id).addEventListener('input',event=>{if(id==='rest')rest=Number(event.target.value);else pace=Number(event.target.value);document.querySelector('#'+id+'-output').textContent=event.target.value+' %';draw();});draw();
</script>
</html>
